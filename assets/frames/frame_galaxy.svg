<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <defs>
    <linearGradient id="galNebula" x1="15" y1="15" x2="225" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="75%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f7d875"/>
